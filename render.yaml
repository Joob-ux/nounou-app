# Deploiement Render en un clic (Blueprint) : API + base PostgreSQL, offre gratuite.
services:
  - type: web
    name: nounou-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nounou-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      # A remplir dans le dashboard Render (jamais dans le code)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  - name: nounou-db
    plan: free
    region: frankfurt
    databaseName: nounou
    user: nounou
